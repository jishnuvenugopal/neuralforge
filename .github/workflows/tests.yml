name: tests

# The test suite is the verification gate's own evidence: 69 tests, including
# regression tests for the four exploits the first gate let through. The
# simulator tests skip themselves when Yosys or Icarus is missing, and unittest
# still exits 0 on skips, so the job fails if any test is skipped.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Yosys and Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys iverilog

      - name: Tool versions
        run: |
          yosys -V
          iverilog -V 2>&1 | head -n 1

      - name: Install Python packages
        run: pip install -r backend/requirements.txt

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test.log

      - name: Fail on skipped tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if grep -q "skipped=" test.log; then
            echo "::error::Tests were skipped, so the gate was not fully tested:"
            grep -E "skipped|skip" test.log
            exit 1
          fi
          echo "No tests skipped."

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
