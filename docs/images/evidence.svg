<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>What backs a verdict</title>
  <desc>Three layers of evidence. Layer 1, tests: test_golden.py checks each preset's integer reference on its own and that overflow is an error; test_verifier.py checks the source scan, the result-file verdict, the netlist checks and the hash ledger without EDA tools; test_exploits_eda.py runs real Yosys and Icarus, where reference RTL for all three presets passes and the four exploits and a one-bit shift error fail; test_providers.py checks streamed and parallel tool calls, bad JSON, empty streams and refusals on fake SDK clients; test_stat_parser.py covers both Yosys report layouts. Layer 2, CI in .github/workflows/tests.yml on every push to main and every pull request: the tests job runs the whole suite on Ubuntu 24.04 with apt's Yosys and Icarus and fails if any test is skipped; the frontend job runs npm ci and the UI build; actions are pinned to commit SHAs with a read-only token and no secrets. Layer 3, real runs: live runs through the same WebSocket as the dashboard, each named by date, provider and model in the Results table; and a saved run in docs/runs with the RTL, its sha256 and the verdict, which recheck.py re-runs through both gates. Not measured yet: the pass rate over repeated runs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a8190"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="799" rx="24" fill="#0f1115" stroke="#24272f"/>

  <text x="48" y="64" font-size="28" font-weight="700" fill="#eef0f4">What backs a verdict</text>
  <text x="48" y="96" font-size="17" fill="#b4b9c6">Three layers: tests of the gate, CI that runs them on a neutral machine, and real runs that can be re-checked.</text>

  <!-- ===== 1 tests ===== -->
  <text x="48" y="142" font-size="14" font-weight="600" letter-spacing="1.2" fill="#858b99">1 · TESTS</text>

  <g font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#eef0f4">
    <rect x="48" y="156" width="264" height="160" rx="14" fill="#1a1c22" stroke="#30333c"/>
    <text x="68" y="187">test_golden.py</text>
    <rect x="328" y="156" width="264" height="160" rx="14" fill="#1a1c22" stroke="#30333c"/>
    <text x="348" y="187">test_verifier.py</text>
    <rect x="608" y="156" width="264" height="160" rx="14" fill="#112a20" stroke="#2f6e52"/>
    <text x="628" y="187">test_exploits_eda.py</text>
    <rect x="888" y="156" width="264" height="160" rx="14" fill="#1a1c22" stroke="#30333c"/>
    <text x="908" y="187">test_providers.py</text>
  </g>
  <g font-size="14">
    <text x="68" y="209" fill="#858b99">the integer reference</text>
    <text x="348" y="209" fill="#858b99">the gate's logic</text>
    <text x="628" y="209" fill="#6fbf98">the gate with real tools</text>
    <text x="908" y="209" fill="#858b99">the provider layer</text>
  </g>
  <g font-size="14" fill="#b4b9c6">
    <text><tspan x="68" y="238">Each preset's reference is</tspan><tspan x="68" y="258">checked on its own; integer</tspan><tspan x="68" y="278">overflow is an error, not a</tspan><tspan x="68" y="298">wrap.</tspan></text>
    <text><tspan x="348" y="238">Source scan, result-file</tspan><tspan x="348" y="258">verdict, netlist checks and</tspan><tspan x="348" y="278">the hash ledger. Needs no</tspan><tspan x="348" y="298">EDA tools.</tspan></text>
    <text><tspan x="628" y="238">Reference RTL for all three</tspan><tspan x="628" y="258">presets passes. The four</tspan><tspan x="628" y="278">exploits and a one-bit shift</tspan><tspan x="628" y="298">error fail.</tspan></text>
    <text><tspan x="908" y="238">Streamed and parallel tool</tspan><tspan x="908" y="258">calls, bad JSON, empty</tspan><tspan x="908" y="278">streams and refusals, on</tspan><tspan x="908" y="298">fake SDK clients.</tspan></text>
  </g>
  <text x="48" y="342" font-size="14" fill="#858b99">Also <tspan font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#b4b9c6">test_stat_parser.py</tspan>: cell and flip-flop counts are read correctly from both Yosys report layouts.</text>

  <line x1="600" y1="356" x2="600" y2="392" stroke="#7a8190" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="616" y="379" font-size="14" fill="#858b99">run on every push to main and every pull request</text>

  <!-- ===== 2 CI ===== -->
  <rect x="48" y="396" width="1104" height="156" rx="16" fill="#0f2119" stroke="#2f6e52"/>
  <text x="68" y="426" font-size="14" font-weight="600" letter-spacing="1.2" fill="#84e3b5">2 · CI ON A NEUTRAL RUNNER</text>
  <text x="1132" y="426" text-anchor="end" font-size="14" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#8fb8a4">.github/workflows/tests.yml</text>

  <rect x="68" y="442" width="542" height="94" rx="10" fill="#112a20" stroke="#2f6e52"/>
  <text x="84" y="470" font-size="16" font-weight="700" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#eef0f4">tests</text>
  <text font-size="15" fill="#b4b9c6"><tspan x="84" y="495">The whole suite on Ubuntu 24.04 with apt's Yosys and Icarus.</tspan><tspan x="84" y="517"><tspan font-weight="700" fill="#f1c56e">Fails if any test is skipped</tspan>, so a green run means the gate ran.</tspan></text>

  <rect x="626" y="442" width="244" height="94" rx="10" fill="#112a20" stroke="#2f6e52"/>
  <text x="642" y="470" font-size="16" font-weight="700" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#eef0f4">frontend</text>
  <text font-size="15" fill="#b4b9c6"><tspan x="642" y="495">npm ci, then the UI build.</tspan></text>

  <text font-size="14" fill="#8fb8a4"><tspan x="894" y="470">Actions pinned to commit SHAs</tspan><tspan x="894" y="493">Read-only token</tspan><tspan x="894" y="516">No secrets in the workflow</tspan></text>

  <!-- ===== 3 real runs ===== -->
  <text x="48" y="590" font-size="14" font-weight="600" letter-spacing="1.2" fill="#858b99">3 · REAL RUNS</text>

  <rect x="48" y="604" width="540" height="124" rx="14" fill="#10283a" stroke="#2e6489"/>
  <text x="68" y="635" font-size="17" font-weight="700" fill="#eef0f4">Live runs</text>
  <text font-size="15" fill="#b4b9c6"><tspan x="68" y="661">A real model, driven through the same WebSocket as the dashboard.</tspan><tspan x="68" y="683">Every row of the Results table names its date, provider and</tspan><tspan x="68" y="705">model, and says whether it can be re-checked.</tspan></text>

  <rect x="612" y="604" width="540" height="124" rx="14" fill="#10283a" stroke="#2e6489"/>
  <text x="632" y="635" font-size="17" font-weight="700" fill="#eef0f4">A saved run anyone can re-check</text>
  <text font-size="15" fill="#b4b9c6"><tspan x="632" y="661"><tspan font-size="14" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#8ccfff">docs/runs/</tspan> holds the generated RTL, its sha256 and the verdict.</tspan><tspan x="632" y="683"><tspan font-size="14" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#8ccfff">recheck.py</tspan> re-runs both gates on that RTL and exits non-zero</tspan><tspan x="632" y="705">if the hash or the verdict differs from the record.</tspan></text>

  <text x="48" y="766" font-size="15" fill="#858b99"><tspan font-weight="600" fill="#f1c56e">Not measured yet:</tspan> the pass rate over repeated runs of the same preset and model.</text>
</svg>
